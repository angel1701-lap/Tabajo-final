version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: zapatillas_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zapatillas_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build: ./backend
    container_name: backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: zapatillas_db
      ML_SERVICE_URL: http://ml-service:5000
    ports:
      - "3000:3000"
    depends_on:
      - mysql
    volumes:
      - ./backend:/app
      - /app/node_modules

  ml-service:
    build: ./ml-service
    container_name: ml-service
    ports:
      - "5000:5000"
    volumes:
      - ./ml-service:/app
      - /app/venv

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mysql_data:
